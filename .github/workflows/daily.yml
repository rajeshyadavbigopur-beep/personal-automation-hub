name: Daily automation heartbeat

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm scheduled workflow ran
        run: |
          echo "Daily workflow ran at $(date -u)"
          echo "Schedule test only; live price collection is not enabled yet."
