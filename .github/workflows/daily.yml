name: Daily gold and silver benchmark

on:
  schedule:
    # 03:30 UTC = 09:00 India Standard Time
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-bullion-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependency
        run: python -m pip install requests
      - name: Collect gold and silver spot benchmarks
        run: python collect_prices.py
      - name: Save daily history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spot_history.csv
          if git diff --cached --quiet; then
            echo "No history changes to save."
          else
            git commit -m "Update daily gold and silver spot history"
            git push
          fi
